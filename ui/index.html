<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Touch Bar</title>
<link rel="stylesheet" href="touchbar.css">
<script src="touchbar.js" defer></script>
</head>
<body data-orientation="horizontal" data-edge="top" data-expanded="false">
<main class="touch-bar" aria-label="Touch Bar">
  <button class="key escape" type="button" aria-label="收起调节">esc</button>
  <div class="drag-grip" title="按住此处拖动组件" aria-hidden="true"></div>
  <div class="empty-space">
    <div id="components" class="component-viewport" role="group" aria-label="全部组件：滚轮浏览，Shift 加滚轮可在任意按钮上浏览" hidden>
      <div class="component-track">
        <button class="key component" type="button" data-adjust="brightness" data-step="-1" aria-label="降低亮度" title="降低亮度"><svg viewBox="0 0 26 24" aria-hidden="true"><circle cx="9" cy="12" r="3"/><path d="M9 5v1M9 18v1M2 12h1M15 12h1M4 7l1 1M13 16l1 1M4 17l1-1M13 8l1-1M19 12h5"/></svg></button>
        <button class="key component" type="button" data-adjust="brightness" aria-label="亮度" title="亮度"><svg viewBox="0 0 26 24" aria-hidden="true"><circle cx="12" cy="12" r="3.7"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
        <button class="key component" type="button" data-adjust="brightness" data-step="1" aria-label="提高亮度" title="提高亮度"><svg viewBox="0 0 26 24" aria-hidden="true"><circle cx="9" cy="12" r="3"/><path d="M9 5v1M9 18v1M2 12h1M15 12h1M4 7l1 1M13 16l1 1M4 17l1-1M13 8l1-1M19 12h5M21.5 9.5v5"/></svg></button>
        <button class="key component" type="button" data-adjust="volume" data-step="-1" aria-label="降低音量" title="降低音量"><svg viewBox="0 0 26 24" aria-hidden="true"><path class="speaker" d="M3 9h4l5-4v14l-5-4H3Z"/><path d="M18 12h6"/></svg></button>
        <button class="key component" type="button" data-adjust="volume" aria-label="音量" title="音量"><svg viewBox="0 0 26 24" aria-hidden="true"><path class="speaker" d="M3 9h4l5-4v14l-5-4H3Z"/><path d="M16 8a6 6 0 0 1 0 8M19 5a10 10 0 0 1 0 14"/></svg></button>
        <button class="key component" type="button" data-adjust="volume" data-step="1" aria-label="提高音量" title="提高音量"><svg viewBox="0 0 26 24" aria-hidden="true"><path class="speaker" d="M3 9h4l5-4v14l-5-4H3Z"/><path d="M18 12h6M21 9v6"/></svg></button>
        <button class="key component" type="button" data-mute aria-pressed="false" aria-label="静音" title="静音"><svg viewBox="0 0 26 24" aria-hidden="true"><path class="speaker" d="M3 9h4l5-4v14l-5-4H3Z"/><path d="m17 9 6 6m0-6-6 6"/></svg></button>
        <button class="key component" type="button" data-action="mediaPrevious" aria-label="上一首" title="上一首"><svg viewBox="0 0 26 24" aria-hidden="true"><path class="solid-symbol" d="M3 5h2v14H3zM14 5v14L5 12zM24 5v14l-10-7z"/></svg></button>
        <button class="key component" type="button" data-action="mediaPlayPause" aria-label="播放 / 暂停" title="播放 / 暂停"><svg viewBox="0 0 26 24" aria-hidden="true"><path class="solid-symbol" d="m4 5 10 7-10 7zM17 5h2v14h-2zM22 5h2v14h-2z"/></svg></button>
        <button class="key component" type="button" data-action="mediaNext" aria-label="下一首" title="下一首"><svg viewBox="0 0 26 24" aria-hidden="true"><path class="solid-symbol" d="M21 5h2v14h-2zM12 5v14l9-7zM2 5v14l10-7z"/></svg></button>
        <button class="key component" type="button" data-action="showDesktop" aria-label="显示桌面" title="显示桌面"><svg viewBox="0 0 26 24" aria-hidden="true"><rect x="2.5" y="4" width="21" height="14" rx="1.5"/><path d="M9 22h8M13 18v4"/></svg></button>
        <button class="key component" type="button" data-action="taskView" aria-label="任务视图" title="任务视图"><svg viewBox="0 0 26 24" aria-hidden="true"><rect x="7" y="5" width="12" height="14" rx="1.5"/><path d="M3 8H1v8h2M23 8h2v8h-2"/></svg></button>
        <button class="key component" type="button" data-action="openExplorer" aria-label="文件管理器" title="文件管理器"><svg viewBox="0 0 26 24" aria-hidden="true"><path d="M3 6h7l2 3h11v11H3Z"/><path d="M3 9V4h7l2 2h9v3"/></svg></button>
      </div>
    </div>
    <section id="adjustment" class="adjustment" aria-label="音量调节" hidden>
      <button class="close-adjustment" type="button" aria-label="关闭调节"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8m0-8-8 8"/></svg></button>
      <div class="slider-controls">
        <svg class="adjustment-icon brightness-symbol" viewBox="0 0 24 24" aria-hidden="true" hidden><circle cx="12" cy="12" r="3.7"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="adjustment-icon volume-symbol" viewBox="0 0 26 24" aria-hidden="true"><path class="speaker" d="M3 9h4l5-4v14l-5-4H3Z"/><path d="M16 8a6 6 0 0 1 0 8M19 5a10 10 0 0 1 0 14"/></svg>
        <input id="adjustment-slider" type="range" min="0" max="100" step="1" value="0" aria-label="音量" aria-orientation="horizontal" disabled>
        <output id="adjustment-value" for="adjustment-slider" aria-hidden="true">0%</output>
      </div>
      <div class="control-feedback" hidden>
        <span class="control-status" role="status" aria-live="polite"></span>
        <button class="retry-control" type="button" aria-label="重新读取状态"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 8a6.2 6.2 0 1 0 .1 4M16 4v4h-4"/></svg><span class="retry-label">重试</span></button>
      </div>
    </section>
  </div>
  <div class="control-strip" role="group" aria-label="系统控制">
    <button class="expand" type="button" aria-label="展开组件" aria-expanded="false" aria-controls="components" title="展开组件"><svg viewBox="0 0 12 20" aria-hidden="true"><path d="m8 4-5 6 5 6"/></svg></button>
    <div class="compact-controls">
    <button id="brightness-button" class="key control" type="button" aria-label="亮度" aria-expanded="false" aria-controls="adjustment"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.7"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    <button id="volume-button" class="key control" type="button" aria-label="音量" aria-expanded="false" aria-controls="adjustment"><svg viewBox="0 0 26 24" aria-hidden="true"><path class="speaker" d="M3 9h4l5-4v14l-5-4H3Z"/><path class="volume-waves" d="M16 8a6 6 0 0 1 0 8M19 5a10 10 0 0 1 0 14"/></svg></button>
    <button id="mute-button" class="key control" type="button" aria-label="静音" aria-pressed="false" disabled><svg viewBox="0 0 26 24" aria-hidden="true"><path class="speaker" d="M3 9h4l5-4v14l-5-4H3Z"/><path d="m17 9 6 6m0-6-6 6"/></svg></button>
    </div>
  </div>
</main>
</body>
</html>
